name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Adversarial + unit tests
        run: pytest
      - name: End-to-end run on sample telemetry
        run: soc-orchestrator run samples/events.jsonl

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t soc-orchestrator .
      - name: Smoke test
        run: |
          docker run -d --name orch -p 8000:8000 -e DB_PATH=/app/data/o.db soc-orchestrator
          for i in $(seq 1 20); do curl -fsS localhost:8000/health && break; sleep 1; done
          python3 - <<'PY'
          import json, urllib.request
          recs = []
          for line in open("samples/events.jsonl"):
              try:
                  obj = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(obj, dict):
                  recs.append(obj)
          req = urllib.request.Request("http://localhost:8000/ingest", json.dumps({"records": recs}).encode(),
                                       {"content-type": "application/json"})
          body = json.load(urllib.request.urlopen(req))
          assert len(body["incidents"]) == 2, body
          print("ingest ok:", [i["title"] for i in body["incidents"]])
          PY
          curl -fsS localhost:8000/audit/verify
